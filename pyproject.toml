[project]
name = "tatva-data-factory"
version = "1.2.0"
description = "Receipts-first dataset cleansing engine: provenance-gated ingest, reproducible corpus build hashes, chained filtered builds (public product name: Shuddhi)"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "ShepHertz Technologies" }]
keywords = ["dataset", "corpus", "deduplication", "provenance", "llm", "training-data", "indic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Documentation = "https://github.com/agentanywhere/shuddhi/tree/main/docs"
Source = "https://github.com/agentanywhere/shuddhi"
Issues = "https://github.com/agentanywhere/shuddhi/issues"

[project.optional-dependencies]
lid = ["fasttext-predict"]
tokens = ["tokenizers"]
extract = ["trafilatura"]
dev = ["pytest"]

[project.scripts]
data-factory = "factory:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "factory", "registry", "shards", "dedup", "neardup", "lid", "quality",
  "domain", "contamination", "tokens", "ngram_lm", "pii", "toxicity",
  "extract", "builder", "build_eval_set", "plugins", "tokenizer_lab",
]
