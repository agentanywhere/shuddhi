# Shuddhi conda environment.
#   conda env create -f environment.yml
#   conda activate shuddhi
#
# numpy comes from conda-forge; the three optional helpers are pip-only
# wheels, which conda installs through the pip section below.
name: shuddhi
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - numpy>=1.24
  - pytest
  - pip
  - pip:
      - fasttext-predict
      - tokenizers
      - trafilatura
