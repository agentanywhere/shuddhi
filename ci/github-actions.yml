name: Corpus provenance

on:
  pull_request:
    paths: ["registry.json", "corpus/**"]
  push:
    branches: [main]

env:
  SHUDDHI: ghcr.io/agentanywhere/shuddhi:1.2.0

jobs:
  gate:
    name: Provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fails the PR if any shard is untagged, unknown-class, or customer data.
      - name: Check the registry
        run: |
          docker run --rm -v "$PWD:/work" $SHUDDHI \
            check --registry /work/registry.json

  build:
    name: Build and publish the receipt
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the corpus
        run: |
          docker run --rm -v "$PWD:/work" $SHUDDHI \
            pipeline --registry /work/registry.json --out /work/shuddhi-out --emit none
      - name: Record the build hash in the job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("shuddhi-out/build/BUILD-MANIFEST.json"))
          print("## Corpus receipt\n")
          print(f"- filtered build hash: `{m['filtered_build_hash']}`")
          print(f"- parent corpus hash: `{m['parent_corpus_build_hash']}`")
          print(f"- kept: {m['kept_docs']:,} documents")
          for w in m.get("warnings", []):
              print(f"- ⚠️ {w}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-receipt
          path: |
            shuddhi-out/build/BUILD-MANIFEST.json
            shuddhi-out/run/MANIFEST.json
            shuddhi-out/report.html
            shuddhi-out/REPORT.md
